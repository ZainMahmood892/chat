<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Number Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
        }

        .form-card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.97);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        .icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 18px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 28px;
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.35);
        }

        h2 {
            text-align: center;
            color: #222;
            margin-bottom: 8px;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: 600;
        }

        .phone-input {
            display: flex;
            align-items: center;
            border: 2px solid #e5e7eb;
            border-radius: 14px;
            overflow: hidden;
            background: #fafafa;
            transition: 0.3s ease;
        }

        .phone-input:focus-within {
            border-color: #667eea;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
        }

        .country-code {
            padding: 15px 12px;
            border-right: 1px solid #ddd;
            color: #555;
            font-size: 14px;
            font-weight: 600;
            background: #f3f4f6;
        }

        input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            padding: 15px;
            font-size: 16px;
            color: #222;
        }

        input::placeholder {
            color: #aaa;
        }

        .hint {
            margin-top: 7px;
            color: #999;
            font-size: 12px;
        }

        button {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            transition: 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 25px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .privacy {
            text-align: center;
            margin-top: 18px;
            font-size: 12px;
            color: #999;
        }

        @media (max-width: 480px) {
            .form-card {
                padding: 28px 22px;
            }

            h2 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <div class="form-card">

        <div class="icon">📱</div>

        <h2>Enter Your Phone</h2>

        <p class="subtitle">
            We'll use your number to verify your account.
        </p>

        <form>

            <div class="input-group">
                <label for="phone">Phone Number</label>

                <div class="phone-input">
                    <span class="country-code">+92</span>

                    <input type="tel" id="phone" name="phone" placeholder="300 1234567" autocomplete="tel" required>
                </div>

                <p class="hint">
                    Enter your mobile number without the country code.
                </p>
            </div>

            <button type="submit">
                Continue →
            </button>

        </form>

        <p class="privacy">
            🔒 Your phone number is safe and private.
        </p>

    </div>

</body>

</html>
